[project]
name = "bank-churn-prediction"
version = "1.0.0"
description = "End-to-end ML pipeline for bank customer churn prediction"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "imbalanced-learn>=0.11",
]

[project.scripts]
predict = "ml_classifier_pipeline:main"